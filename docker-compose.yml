services:
  neo4j:
    image: neo4j:5.26
    container_name: xpoll-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/xpolllocal12345
    volumes:
      - ./docker/neo4j/data:/data
      - ./docker/neo4j/logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
